<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indira Devi Royal Alliance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://ajax.googleapis.com" />
    <link rel="preconnect" href="https://code.angularjs.org" />
    <link rel="preconnect" href="https://maxcdn.bootstrapcdn.com" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="assets/zero.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/indira-devi-logo.jpg" fetchpriority="high" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css" />
    <style>
        :root {
            --bg: #f6f2ec;
            --paper: #ffffff;
            --ink: #2f2a26;
            --accent: #b45a3c;
            --line: #e5d5c9;
            --success: #2c7a53;
            --danger: #a33131;
        }

        html, body {
            min-height: 100%;
            background: radial-gradient(circle at 10% 0, #fff7f1 0%, var(--bg) 45%);
            color: var(--ink);
            font-family: "Montserrat", "Segoe UI", sans-serif;
        }

        .app-shell {
            max-width: 1080px;
            margin: 16px auto;
            padding: 0 16px 20px;
        }

        .hero {
            background: linear-gradient(130deg, #fff6ef 0%, #fefefe 55%, #ffece2 100%);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(95, 66, 52, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .hero h1 {
            margin: 0;
            font-family: "Playfair Display", Georgia, serif;
            font-size: 30px;
            line-height: 1.2;
        }

        .hero p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        .hero-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex: 1 1 auto;
            min-width: 0;
        }

        .brand-logo-wrap {
            flex: 0 0 auto;
            background: #fff;
            border: 1px solid #e8dfd8;
            border-radius: 12px;
            padding: 8px 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .brand-logo {
            display: block;
            width: 132px;
            max-width: 100%;
            height: auto;
        }

        .brand-copy {
            flex: 1 1 260px;
            min-width: 240px;
        }

        .top-nav {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex: 0 0 auto;
        }

        .nav-pills {
            margin: 0;
        }

        .top-nav .nav-pills > li {
            float: none;
            margin: 0 0 8px;
        }

        .top-nav .nav-pills > li:last-child {
            margin-bottom: 0;
        }

        .nav-pills > li > a {
            color: var(--ink);
            border: 1px solid var(--line);
            background: var(--paper);
            border-radius: 999px;
            margin-right: 0;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
        }

        .nav-pills > li.active > a,
        .nav-pills > li.active > a:hover,
        .nav-pills > li.active > a:focus {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .header-logout {
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            font-weight: 600;
            min-width: 120px;
            text-align: center;
        }

        .page-card {
            border-radius: 16px;
            border: 1px solid var(--line);
            background: var(--paper);
            padding: 20px;
            box-shadow: 0 10px 24px rgba(73, 46, 33, 0.05);
        }

        .section-title {
            font-family: "Playfair Display", Georgia, serif;
            margin-top: 0;
            margin-bottom: 14px;
        }

        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-accent:hover,
        .btn-accent:focus {
            background: #9f4d34;
            border-color: #9f4d34;
            color: #fff;
        }

        .status {
            margin-top: 10px;
            margin-bottom: 0;
            font-size: 13px;
        }

        .status.error {
            color: var(--danger);
        }

        .status.success {
            color: var(--success);
        }

        .table > tbody > tr > td {
            vertical-align: middle;
        }

        .chip {
            display: inline-block;
            border-radius: 999px;
            padding: 2px 8px;
            border: 1px solid var(--line);
            background: #fff8f3;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
        }

        .subtle {
            color: #766f6b;
        }

        .home-shell {
            display: grid;
            gap: 18px;
        }

        .home-hero {
            display: grid;
            grid-template-columns: 1.45fr 0.95fr;
            gap: 16px;
            align-items: stretch;
        }

        .home-featured {
            position: relative;
            min-height: 420px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #ead8cb;
            background: linear-gradient(145deg, #6f3321 0%, #b45a3c 55%, #d6845b 100%);
            box-shadow: 0 14px 28px rgba(87, 44, 30, 0.24);
        }

        .home-featured img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.08) contrast(1.02);
        }

        .home-featured::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, rgba(26, 14, 10, 0.8) 0%, rgba(44, 18, 9, 0.42) 50%, rgba(72, 30, 12, 0.12) 100%);
        }

        .home-featured-copy {
            position: relative;
            z-index: 1;
            max-width: 560px;
            padding: 28px;
            color: #fff6f0;
        }

        .home-kicker {
            display: inline-block;
            font-size: 12px;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.38);
            margin-bottom: 12px;
        }

        .home-title {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 44px;
            line-height: 1.05;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
        }

        .home-copy {
            margin-top: 12px;
            font-size: 15px;
            line-height: 1.6;
            max-width: 510px;
            color: #ffece3;
        }

        .home-highlight-row {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .home-highlight {
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #fff8f2;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.12);
        }

        .home-login-card {
            border: 1px solid #e6d2c4;
            border-radius: 16px;
            background: linear-gradient(180deg, #fffaf6 0%, #fff4ed 100%);
            padding: 18px;
            box-shadow: 0 8px 24px rgba(90, 54, 38, 0.09);
        }

        .home-login-title {
            font-family: "Playfair Display", Georgia, serif;
            margin: 0 0 6px;
            font-size: 30px;
            color: #6f3424;
        }

        .home-login-subtle {
            color: #7f6a61;
            font-size: 13px;
            margin: 0 0 14px;
        }

        .home-login-card .form-control {
            border-radius: 10px;
            border-color: #dfc8bb;
            box-shadow: none;
            height: 42px;
        }

        .home-login-card label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #7f5a4a;
        }

        .home-login-quick {
            margin-top: 10px;
            display: grid;
            gap: 8px;
        }

        .home-quick-pill {
            border: 1px solid #e6d2c4;
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 13px;
            color: #6d5850;
            background: #fff;
        }

        .home-gallery {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            content-visibility: auto;
            contain-intrinsic-size: 360px;
        }

        .home-card {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #ead8cb;
            background: #fff;
            box-shadow: 0 10px 20px rgba(70, 42, 31, 0.08);
        }

        .home-card-media {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .home-card-body {
            padding: 12px 14px 14px;
        }

        .home-card-title {
            margin: 0 0 4px;
            font-size: 18px;
            font-family: "Playfair Display", Georgia, serif;
            color: #6b3a2a;
        }

        .home-card-copy {
            margin: 0;
            font-size: 13px;
            color: #6e635f;
            line-height: 1.5;
        }

        .home-values {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            content-visibility: auto;
            contain-intrinsic-size: 180px;
        }

        .home-value {
            border: 1px solid #ead9cd;
            border-radius: 14px;
            padding: 14px;
            background: linear-gradient(180deg, #fffdfa 0%, #fff7f2 100%);
        }

        .home-value h4 {
            margin: 0;
            font-family: "Playfair Display", Georgia, serif;
            font-size: 22px;
            color: #6b3a2a;
        }

        .home-value p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #6a5e58;
            line-height: 1.55;
        }

        @media (max-width: 767px) {
            .hero {
                flex-direction: column;
                align-items: stretch;
            }

            .hero h1 {
                font-size: 24px;
            }

            .page-card {
                padding: 14px;
            }

            .hero-brand {
                justify-content: center;
            }

            .brand-logo {
                width: 118px;
            }

            .brand-copy {
                text-align: center;
            }

            .top-nav {
                align-items: center;
            }

            .home-featured {
                min-height: 320px;
            }

            .home-title {
                font-size: 32px;
            }

            .home-featured-copy {
                padding: 20px;
            }
        }

        @media (max-width: 991px) {
            .home-hero {
                grid-template-columns: 1fr;
            }

            .home-gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .home-values {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            .home-gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body ng-app="weddingApp" ng-controller="appCtrl" role="document">
    <div class="app-shell">
        <header class="hero">
            <div class="hero-brand">
                <div class="brand-logo-wrap">
                    <img class="brand-logo" src="assets/indira-devi-logo.jpg" width="420" height="311" loading="eager" decoding="async" fetchpriority="high" alt="Indira Devi Royal Alliance Hyderabad" />
                </div>
                <div class="brand-copy">
                    <h1>Indira Devi Royal Alliance</h1>
                    <p>Trusted Bonds for Life</p>
                </div>
            </div>
            <div class="top-nav">
                <ul class="nav nav-pills">
                    <li role="presentation" ng-if="isAdminLoggedIn"><a href="#!/home">Home</a></li>
                    <li role="presentation" ng-if="isAdminLoggedIn"><a href="#!/users">Profiles</a></li>
                </ul>
                <button type="button" class="btn header-logout" ng-if="isAdminLoggedIn" ng-click="logoutFromHeader()">Logout</button>
            </div>
        </header>
        <main class="page-card">
            <div ng-view></div>
        </main>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.2.25/angular.min.js"></script>
    <script src="https://code.angularjs.org/1.2.25/angular-route.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
    <script type="text/javascript">
        var apiEndpoint = "";
    </script>
    <script src="app/scripts/app.js"></script>
    <script src="app/scripts/authSvc.js"></script>
    <script src="app/scripts/appCtrl.js"></script>
    <script src="app/scripts/homeCtrl.js"></script>
    <script src="app/scripts/usersSvc.js"></script>
    <script src="app/scripts/usersCtrl.js"></script>
</body>
</html>
